<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>地図</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .bus-stop-marker {
        width: 28px;
        height: 28px;
        background-color: #1976d2;
        color: white;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 17px;
        font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView(
      [47.9187, 106.9075],
      14
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
      }
    ).addTo(map);

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        L.marker([lat, lng])
          .addTo(map)
          .bindPopup("現在地")
          .openPopup();

        map.setView([lat, lng], 16);
      },

      (error) => {
        console.error("現在地を取得できませんでした", error);
        alert("現在地を取得できませんでした");
      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

      
    );

    const busStopIcon = L.divIcon({
    className: "",
    html: '<div class="bus-stop-marker">B</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 17],
    popupAnchor: [0, -17]
    });

    async function loadBusStops() {
    try {
        const response = await fetch("./busstops-osm.json");

        if (!response.ok) {
        throw new Error(`ファイルの取得に失敗: ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data.elements)) {
        throw new Error(
            "OSMの生データではありません。Exportのraw dataで保存してください"
        );
        }

        let count = 0;

        data.elements.forEach((stop) => {
        // 点はlat・lon、線や面はcenter内の座標を使う
        const lat = stop.lat ?? stop.center?.lat;
        const lng = stop.lon ?? stop.center?.lon;

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng) ||
            Math.abs(lat) > 90 ||
            Math.abs(lng) > 180
        ) {
            return;
        }

        const tags = stop.tags ?? {};
        const names = [
            tags["name:mn"] || tags.name,
            tags["name:en"]
        ].filter(Boolean);

        const label = document.createElement("div");
        label.textContent =
            [...new Set(names)].join(" / ") || "名称未登録のバス停";

        L.marker([lat, lng], {
            icon: busStopIcon
        })
            .addTo(map)
            .bindPopup(label);

        count++;
        });

        console.log(`バス停を${count}件表示しました`);

        if (count === 0) {
        alert("表示できるバス停がありませんでした");
        }
    } catch (error) {
        console.error(error);
        alert(
        "バス停データを読み込めませんでした\n" + error.message
        );
    }
    }

    loadBusStops();
  </script>
</body>
</html>
