<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UB Bus Map</title>

  <link
    rel="stylesheet"
    href="./assets/vendor/leaflet/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >

</head>


<body>


  <!-- ========================================
       Top Search
  ======================================== -->

  <div id="search-panel">

    <div id="place-search-row">

      <input
        type="text"
        id="place-search"
        placeholder="Search place..."
      >

      <button id="search-button">
        🔍
      </button>

    </div>


    <div id="search-results"></div>

  </div>



  <!-- ========================================
       Bottom UI
  ======================================== -->

  <div id="bottom-container">


    <!-- Toolbar -->

    <div id="bottom-toolbar">


      <!-- Bus Stop Visibility -->

      <button
        id="bus-stop-toggle"
        class="tool-button hide-action"
        aria-label="Hide bus stops"
      >

        <div class="toolbar-bus-marker">
          B
        </div>

      </button>


      <div id="toolbar-space"></div>


      <!-- Open / Close Route Panel -->

      <button
        id="panel-toggle"
        class="tool-button"
        aria-label="Close route search"
      >
        ▼
      </button>


    </div>



    <!-- ========================================
         Route Search Panel
    ======================================== -->

    <div id="route-panel">


      <!-- Start -->

      <div class="bus-input-row">

        <div class="bus-input-label">
          Start:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="start-stop-input"
            class="bus-input"
            placeholder="select a map pin or Enter bus stop name"
          >

          <div
            id="start-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <div
        class="route-direction-arrow"
        aria-hidden="true"
      >
        ↓
      </div>



      <!-- Destination -->

      <div class="bus-input-row after-direction-arrow">

        <div class="bus-input-label">
          Destination:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="destination-stop-input"
            class="bus-input"
            placeholder="select a map pin or Enter bus stop name"
          >

          <div
            id="destination-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <!-- Search Routes -->

      <button
        id="route-search-button"
        disabled
      >
        Search Routes
      </button>


      <div
        id="route-results"
        aria-live="polite"
      ></div>


    </div>

  </div>



  <!-- ========================================
       Map
  ======================================== -->

  <div id="map"></div>



  <script
    src="./assets/vendor/leaflet/leaflet.js"
  ></script>



  <script src="./app.js"></script>


</body>

</html>
