<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UB Bus Map</title>

  <link
    rel="stylesheet"
    href="./assets/vendor/leaflet/leaflet.css"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }


    /* ========================================
       Bus Stop Marker
    ======================================== */

    .bus-stop-marker {
      width: 22px;
      height: 22px;

      background-color: #1976d2;
      color: white;

      border: 2px solid white;
      border-radius: 50%;

      box-shadow:
        0 1px 4px
        rgba(0, 0, 0, 0.45);

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 14px;
      font-weight: bold;

      box-sizing: content-box;
    }

    /* ========================================
       Top Search Panel
    ======================================== */

    #search-panel {
      position: absolute;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      width: 90%;
      max-width: 500px;

      background: white;

      padding: 10px;

      border-radius: 8px;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.3);
    }


    #place-search-row {
      display: flex;
      width: 100%;
    }


    #place-search {
      flex: 1;

      padding: 9px;

      font-size: 16px;

      box-sizing: border-box;
    }


    #search-button {
      width: 50px;

      font-size: 16px;

      cursor: pointer;
    }


    #search-results {
      background: white;

      max-height: 200px;

      overflow-y: auto;
    }


    .search-result {
      padding: 8px;

      border-bottom: 1px solid #ddd;

      cursor: pointer;
    }


    .search-result:hover {
      background: #eee;
    }


    /* ========================================
       Bottom Container
    ======================================== */

    #bottom-container {
      position: absolute;

      bottom: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      width: 90%;
      max-width: 500px;

      background: white;

      border-radius: 8px;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.3);

      overflow: visible;
    }


    /* ========================================
       Toolbar
    ======================================== */

    #bottom-toolbar {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 8px;

      min-height: 46px;

      box-sizing: border-box;
    }


    .tool-button {
      width: 44px;
      height: 44px;

      border: 1px solid #aaa;
      border-radius: 6px;

      background: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0;

      cursor: pointer;

      flex-shrink: 0;
    }


    .tool-button:hover {
      background: #f2f2f2;
    }


    #toolbar-space {
      flex: 1;
    }


    /* ========================================
       Bus Stop Toggle
    ======================================== */

    #bus-stop-toggle {
      position: relative;
    }


    .toolbar-bus-marker {
      position: relative;

      width: 22px;
      height: 22px;

      background-color: #1976d2;
      color: white;

      border: 2px solid white;
      border-radius: 50%;

      box-shadow:
        0 1px 4px
        rgba(0, 0, 0, 0.45);

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 14px;
      font-weight: bold;
    }


    #bus-stop-toggle.hide-action
    .toolbar-bus-marker::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 32px;
      height: 3px;

      background: black;

      border-radius: 2px;

      transform:
        translate(-50%, -50%)
        rotate(-45deg);

      z-index: 10;

      pointer-events: none;
    }


    /* ========================================
       Collapse Button
    ======================================== */

    #panel-toggle {
      font-size: 22px;
      font-weight: bold;
    }


    /* ========================================
       Route Panel
    ======================================== */

    #route-panel {
      padding:
        0 10px 10px 10px;

      border-top:
        1px solid #ddd;
    }


    #route-panel.closed {
      display: none;
    }


    .bus-input-row {
      display: flex;
      align-items: center;

      margin-top: 10px;

      position: relative;
    }


    .bus-input-label {
      width: 95px;

      font-weight: bold;

      flex-shrink: 0;
    }


    .bus-input-wrapper {
      flex: 1;

      position: relative;
    }


    .bus-input {
      width: 100%;

      padding: 9px;

      font-size: 15px;

      box-sizing: border-box;
    }


    .route-direction-arrow {
      width: calc(100% - 95px);

      margin:
        7px 0
        7px 95px;

      color: #555;

      text-align: center;
      font-size: 30px;
      font-weight: 600;
      line-height: 1;
    }


    .bus-input-row.after-direction-arrow {
      margin-top: 0;
    }


    /* ========================================
       Bus Stop Suggestions
    ======================================== */

    .bus-suggestions {
      position: absolute;

      bottom: 100%;

      left: 0;
      right: 0;

      background: white;

      border: 1px solid #ccc;

      max-height: 200px;

      overflow-y: auto;

      z-index: 3000;
    }


    .bus-suggestion {
      padding: 8px;

      border-bottom:
        1px solid #ddd;

      cursor: pointer;
    }


    .bus-suggestion:hover {
      background: #eee;
    }


    /* ========================================
       Popup
    ======================================== */

    .popup-button {
      display: block;

      width: 100%;

      padding: 7px;

      margin-top: 5px;

      cursor: pointer;
    }


    /* ========================================
       Search Routes
    ======================================== */

    #route-search-button {
      width: 100%;

      margin-top: 12px;

      padding: 10px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }


    #route-search-button:disabled {
      cursor: not-allowed;

      opacity: 0.5;
    }


    /* ========================================
       Smartphone
    ======================================== */

    @media (max-width: 600px) {

      #search-panel {
        width: calc(100% - 30px);
      }

      #bottom-container {
        width: calc(100% - 20px);

        bottom: 10px;
      }

      .bus-input-label {
        width: 90px;

        font-size: 14px;
      }

      .bus-input {
        font-size: 14px;
      }

      .route-direction-arrow {
        width: calc(100% - 90px);
        margin-left: 90px;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       Top Search
  ======================================== -->

  <div id="search-panel">

    <div id="place-search-row">

      <input
        type="text"
        id="place-search"
        placeholder="Search place..."
      >

      <button id="search-button">
        🔍
      </button>

    </div>


    <div id="search-results"></div>

  </div>



  <!-- ========================================
       Bottom UI
  ======================================== -->

  <div id="bottom-container">


    <!-- Toolbar -->

    <div id="bottom-toolbar">


      <!-- Bus Stop Visibility -->

      <button
        id="bus-stop-toggle"
        class="tool-button hide-action"
        aria-label="Hide bus stops"
      >

        <div class="toolbar-bus-marker">
          B
        </div>

      </button>


      <div id="toolbar-space"></div>


      <!-- Open / Close Route Panel -->

      <button
        id="panel-toggle"
        class="tool-button"
        aria-label="Close route search"
      >
        ▼
      </button>


    </div>



    <!-- ========================================
         Route Search Panel
    ======================================== -->

    <div id="route-panel">


      <!-- Start -->

      <div class="bus-input-row">

        <div class="bus-input-label">
          Start:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="start-stop-input"
            class="bus-input"
            placeholder="Enter bus stop name or select a map pin"
          >

          <div
            id="start-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <div
        class="route-direction-arrow"
        aria-hidden="true"
      >
        ↓
      </div>



      <!-- Destination -->

      <div class="bus-input-row after-direction-arrow">

        <div class="bus-input-label">
          Destination:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="destination-stop-input"
            class="bus-input"
            placeholder="Enter bus stop name or select a map pin"
          >

          <div
            id="destination-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <!-- Search Routes -->

      <button
        id="route-search-button"
        disabled
      >
        Search Routes
      </button>


    </div>

  </div>



  <!-- ========================================
       Map
  ======================================== -->

  <div id="map"></div>



  <script
    src="./assets/vendor/leaflet/leaflet.js"
  ></script>



  <script>


    /* ========================================
       Map
    ======================================== */

    const map =
      L.map("map", {
        zoomControl: false
      }).setView(

        [
          47.9187,
          106.9075
        ],

        14

      );


    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'

      }

    ).addTo(map);



    /* ========================================
       Current Location
    ======================================== */

    const currentLocationIcon =
    L.icon({

        iconUrl:
        "./assets/images/marker-icon-2x-green.png",

        shadowUrl:
        "./assets/images/marker-shadow.png",

        iconSize:
        [25, 41],

        iconAnchor:
        [12, 41],

        popupAnchor:
        [1, -34],

        shadowSize:
        [41, 41]

  });



    navigator.geolocation.getCurrentPosition(

      (position) => {


        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;


        L.marker(
          [lat, lng],
          {
            icon:
              currentLocationIcon
          }
        )

          .addTo(map)

          .bindPopup(
            "Current Location"
          );


        map.setView(
          [lat, lng],
          16
        );

      },


      (error) => {

        console.error(

          "Could not get current location.",

          error

        );

      },


      {

        enableHighAccuracy: true,

        timeout: 10000,

        maximumAge: 0

      }

    );



    /* ========================================
       Bus Stop Icon
    ======================================== */

    const busStopIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="bus-stop-marker">B</div>',

        iconSize:
          [26, 26],

        iconAnchor:
          [13, 13],

        popupAnchor:
          [0, -13]

      });



    /* ========================================
       Bus Stop Layer
    ======================================== */

    const busStopLayer =
      L.layerGroup()
        .addTo(map);


    let busStopsVisible =
      true;


    const busStopToggle =
      document.getElementById(
        "bus-stop-toggle"
      );



    busStopToggle.addEventListener(

      "click",

      () => {


        if (
          busStopsVisible
        ) {


          map.removeLayer(
            busStopLayer
          );


          busStopsVisible =
            false;


          busStopToggle
            .classList
            .remove(
              "hide-action"
            );


          busStopToggle.setAttribute(

            "aria-label",

            "Show bus stops"

          );

        }


        else {


          busStopLayer
            .addTo(map);


          busStopsVisible =
            true;


          busStopToggle
            .classList
            .add(
              "hide-action"
            );


          busStopToggle.setAttribute(

            "aria-label",

            "Hide bus stops"

          );

        }

      }

    );



    /* ========================================
       Route Panel Open / Close
    ======================================== */

    const routePanel =
      document.getElementById(
        "route-panel"
      );


    const panelToggle =
      document.getElementById(
        "panel-toggle"
      );


    let routePanelOpen =
      true;



    panelToggle.addEventListener(

      "click",

      () => {


        if (
          routePanelOpen
        ) {


          routePanel.classList.add(
            "closed"
          );


          panelToggle.textContent =
            "▲";


          panelToggle.setAttribute(

            "aria-label",

            "Open route search"

          );


          routePanelOpen =
            false;

        }


        else {


          routePanel.classList.remove(
            "closed"
          );


          panelToggle.textContent =
            "▼";


          panelToggle.setAttribute(

            "aria-label",

            "Close route search"

          );


          routePanelOpen =
            true;

        }

      }

    );



    /* ========================================
       Bus Stop Data
    ======================================== */

    const busStops =
      [];


    let startBusStop =
      null;


    let destinationBusStop =
      null;



    const startInput =
      document.getElementById(
        "start-stop-input"
      );


    const destinationInput =
      document.getElementById(
        "destination-stop-input"
      );


    const startSuggestions =
      document.getElementById(
        "start-stop-suggestions"
      );


    const destinationSuggestions =
      document.getElementById(
        "destination-stop-suggestions"
      );


    const routeSearchButton =
      document.getElementById(
        "route-search-button"
      );



    /* ========================================
       Route Search Button State
    ======================================== */

    function updateRouteSearchButton() {


      routeSearchButton.disabled =

        !startBusStop ||

        !destinationBusStop;

    }



    /* ========================================
       Set Start / Destination
    ======================================== */

    function setBusStop(
      type,
      stop
    ) {


      if (
        type === "start"
      ) {


        startBusStop =
          stop;


        startInput.value =
          stop.displayName;


        startSuggestions.innerHTML =
          "";

      }



      if (
        type === "destination"
      ) {


        destinationBusStop =
          stop;


        destinationInput.value =
          stop.displayName;


        destinationSuggestions.innerHTML =
          "";

      }


      updateRouteSearchButton();

    }



    /* ========================================
       Load Bus Stops
    ======================================== */

    async function loadBusStops() {


      try {


        const response =
          await fetch(
            "./busstops-osm.json"
          );


        if (
          !response.ok
        ) {


          throw new Error(

            `Failed to load file: ${response.status}`

          );

        }


        const data =
          await response.json();


        if (

          !Array.isArray(
            data.elements
          )

        ) {


          throw new Error(
            "Invalid OSM data."
          );

        }



        let count =
          0;



        data.elements.forEach(

          (element) => {


            const lat =

              element.lat ??

              element.center?.lat;


            const lng =

              element.lon ??

              element.center?.lon;



            if (

              !Number.isFinite(lat) ||

              !Number.isFinite(lng) ||

              Math.abs(lat) > 90 ||

              Math.abs(lng) > 180

            ) {


              return;

            }



            const tags =
              element.tags ?? {};


            const names = [

              tags["name:mn"] ||
              tags.name,

              tags["name:en"]

            ].filter(Boolean);


            const displayName =

              [...new Set(names)]
                .join(" / ")

              ||

              "Unnamed Bus Stop";



            const stop = {


              id:
                busStops.length,


              lat:
                lat,


              lng:
                lng,


              displayName:
                displayName,


              nameMn:

                tags["name:mn"] ||

                tags.name ||

                "",


              nameEn:

                tags["name:en"] ||

                ""

            };


            busStops.push(
              stop
            );



            const marker =
              L.marker(

                [
                  lat,
                  lng
                ],

                {

                  icon:
                    busStopIcon

                }

              );



            const popup =
              document.createElement(
                "div"
              );


            const title =
              document.createElement(
                "div"
              );


            title.textContent =
              displayName;


            title.style.fontWeight =
              "bold";


            popup.appendChild(
              title
            );



            const startButton =
              document.createElement(
                "button"
              );


            startButton.textContent =
              "Set as Start";


            startButton.className =
              "popup-button";


            startButton.addEventListener(

              "click",

              () => {


                setBusStop(
                  "start",
                  stop
                );


                map.closePopup();

              }

            );



            const destinationButton =
              document.createElement(
                "button"
              );


            destinationButton.textContent =
              "Set as Destination";


            destinationButton.className =
              "popup-button";


            destinationButton.addEventListener(

              "click",

              () => {


                setBusStop(
                  "destination",
                  stop
                );


                map.closePopup();

              }

            );



            popup.appendChild(
              startButton
            );


            popup.appendChild(
              destinationButton
            );


            marker

              .addTo(
                busStopLayer
              )

              .bindPopup(
                popup
              );


            stop.marker =
              marker;


            count++;

          }

        );


        console.log(

          `${count} bus stops loaded.`

        );

      }


      catch (error) {


        console.error(
          error
        );


        alert(

          "Could not load bus stop data.\n"

          +

          error.message

        );

      }

    }



    loadBusStops();



    /* ========================================
       Bus Stop Search
    ======================================== */

    function searchBusStops(

      query,

      resultElement,

      type

    ) {


      resultElement.innerHTML =
        "";


      const text =

        query

          .trim()

          .toLowerCase();


      if (
        !text
      ) {

        return;

      }



      const results =

        busStops

          .filter(

            (stop) => {


              return (

                stop.displayName
                  .toLowerCase()
                  .includes(text)

                ||

                stop.nameMn
                  .toLowerCase()
                  .includes(text)

                ||

                stop.nameEn
                  .toLowerCase()
                  .includes(text)

              );

            }

          )

          .slice(
            0,
            8
          );



      if (
        results.length === 0
      ) {


        const noResult =
          document.createElement(
            "div"
          );


        noResult.className =
          "bus-suggestion";


        noResult.textContent =
          "No bus stops found";


        resultElement.appendChild(
          noResult
        );


        return;

      }



      results.forEach(

        (stop) => {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "bus-suggestion";


          item.textContent =
            stop.displayName;


          item.addEventListener(

            "click",

            () => {


              setBusStop(
                type,
                stop
              );


              map.setView(

                [
                  stop.lat,
                  stop.lng
                ],

                16

              );


              if (
                busStopsVisible
              ) {


                stop.marker
                  .openPopup();

              }

            }

          );


          resultElement.appendChild(
            item
          );

        }

      );

    }



    /* ========================================
       Start Input
    ======================================== */

    startInput.addEventListener(

      "input",

      () => {


        if (

          startBusStop &&

          startInput.value !==
            startBusStop.displayName

        ) {


          startBusStop =
            null;


          updateRouteSearchButton();

        }


        searchBusStops(

          startInput.value,

          startSuggestions,

          "start"

        );

      }

    );



    /* ========================================
       Destination Input
    ======================================== */

    destinationInput.addEventListener(

      "input",

      () => {


        if (

          destinationBusStop &&

          destinationInput.value !==
            destinationBusStop.displayName

        ) {


          destinationBusStop =
            null;


          updateRouteSearchButton();

        }


        searchBusStops(

          destinationInput.value,

          destinationSuggestions,

          "destination"

        );

      }

    );



    /* ========================================
       Search Routes
    ======================================== */

    routeSearchButton.addEventListener(

      "click",

      () => {


        if (

          !startBusStop ||

          !destinationBusStop

        ) {


          return;

        }


        alert(

          "Start:\n"

          +

          startBusStop.displayName

          +

          "\n\nDestination:\n"

          +

          destinationBusStop.displayName

        );

      }

    );



    /* ========================================
       Place Search
    ======================================== */

    const searchInput =
      document.getElementById(
        "place-search"
      );


    const searchButton =
      document.getElementById(
        "search-button"
      );


    const searchResults =
      document.getElementById(
        "search-results"
      );


    let searchMarker =
      null;



    /* Red marker for searched place */

    const searchPlaceIcon =
      L.icon({

        iconUrl:
          "./assets/images/marker-icon-2x-red.png",

        shadowUrl:
          "./assets/images/marker-shadow.png",

        iconSize:
          [25, 41],

        iconAnchor:
          [12, 41],

        popupAnchor:
          [1, -34],

        shadowSize:
          [41, 41]

      });



    async function searchPlace() {


      const query =
        searchInput.value.trim();


      if (
        !query
      ) {

        return;

      }


      searchResults.innerHTML =

        "<div class='search-result'>Searching...</div>";



      try {


        const url =

          "https://nominatim.openstreetmap.org/search"

          +

          "?format=json"

          +

          "&limit=5"

          +

          "&countrycodes=mn"

          +

          "&q="

          +

          encodeURIComponent(
            query
          );


        const response =
          await fetch(
            url
          );


        if (
          !response.ok
        ) {


          throw new Error(
            "Place search failed."
          );

        }


        const data =
          await response.json();


        searchResults.innerHTML =
          "";


        if (
          data.length === 0
        ) {


          searchResults.innerHTML =

            "<div class='search-result'>No results found</div>";


          return;

        }


        data.forEach(

          (place) => {


            const item =
              document.createElement(
                "div"
              );


            item.className =
              "search-result";


            item.textContent =
              place.display_name;


            item.addEventListener(

              "click",

              () => {


                const lat =
                  parseFloat(
                    place.lat
                  );


                const lon =
                  parseFloat(
                    place.lon
                  );


                map.setView(

                  [
                    lat,
                    lon
                  ],

                  16

                );


                if (
                  searchMarker
                ) {


                  map.removeLayer(
                    searchMarker
                  );

                }


                searchMarker =

                  L.marker(
                    [
                      lat,
                      lon
                    ],
                    {
                      icon:
                        searchPlaceIcon
                    }
                  )

                    .addTo(map)

                    .bindPopup(
                      place.display_name
                    )

                    .openPopup();


                searchResults.innerHTML =
                  "";

              }

            );


            searchResults.appendChild(
              item
            );

          }

        );

      }


      catch (error) {


        console.error(
          error
        );


        searchResults.innerHTML =

          "<div class='search-result'>Search failed</div>";

      }

    }



    searchButton.addEventListener(

      "click",

      searchPlace

    );


    searchInput.addEventListener(

      "keydown",

      (event) => {


        if (
          event.key === "Enter"
        ) {


          searchPlace();

        }

      }

    );


  </script>


</body>

</html>
