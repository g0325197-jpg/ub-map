<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>UB Bus Map</title>

  <link
    rel="stylesheet"
    href="./assets/vendor/leaflet/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="./styles.css?v=20260919-ios-keyboard-offset"
  >

</head>


<body>


  <!-- ========================================
       Top Search
  ======================================== -->

  <div id="search-panel">

    <div id="place-search-row">

      <input
        type="text"
        id="place-search"
        placeholder="Search place..."
        data-i18n-placeholder="searchPlace"
      >

      <button
        id="search-button"
        aria-label="Search place"
        data-i18n-aria-label="searchPlaceButton"
      >
        🔍
      </button>

    </div>


    <div id="search-results"></div>

  </div>



  <!-- ========================================
       Bottom UI
  ======================================== -->

  <div id="bottom-container">


    <!-- Toolbar -->

    <div id="bottom-toolbar">


      <!-- Bus Stop Visibility -->

      <button
        id="bus-stop-toggle"
        class="tool-button hide-action"
        aria-label="Hide bus stops"
      >

        <div class="toolbar-bus-marker">
          B
        </div>

      </button>


      <!-- Current Location -->

      <button
        id="current-location-button"
        class="tool-button"
        type="button"
        aria-label="Go to current location"
      >

        <svg
        class="toolbar-location-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
        >
        <path
            d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z"
        ></path>

        <circle
            cx="12"
            cy="10"
            r="2.2"
            fill="white"
            stroke="none"
        ></circle>
        </svg>

      </button>


      <!-- Language -->

      <button
        id="language-toggle"
        class="tool-button"
        type="button"
        aria-label="Switch to Mongolian"
      >
        <span
          id="language-toggle-flag"
          class="language-toggle-flag"
          aria-hidden="true"
        >🇬🇧</span>

        <span
          id="language-toggle-code"
          class="language-toggle-code"
        >EN</span>
      </button>


      <div id="toolbar-space"></div>


      <!-- Open / Close Route Panel -->

      <button
        id="panel-toggle"
        class="tool-button"
        aria-label="Close route search"
      >
        ▼
      </button>


    </div>



    <!-- ========================================
         Route Search Panel
    ======================================== -->

    <div id="route-panel">


      <div
        id="route-results-header"
        hidden
      >

        <button
          id="route-back-button"
          type="button"
          aria-label="Back to route search"
        >
          ←
        </button>

        <div id="route-results-summary"></div>

      </div>


      <div id="route-search-form">


      <!-- Start -->

      <div class="bus-input-row">

        <div
          class="bus-input-label"
          data-i18n="startLabel"
        >
          Start:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="start-stop-input"
            class="bus-input"
            placeholder="select a map pin or Enter bus stop name"
            data-i18n-placeholder="busStopPlaceholder"
          >

          <div
            id="start-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <div
        class="route-direction-arrow"
        aria-hidden="true"
      >
        ↓
      </div>



      <!-- Destination -->

      <div class="bus-input-row after-direction-arrow">

        <div
          class="bus-input-label"
          data-i18n="destinationLabel"
        >
          Destination:
        </div>


        <div class="bus-input-wrapper">

          <input
            type="text"
            id="destination-stop-input"
            class="bus-input"
            placeholder="select a map pin or Enter bus stop name"
            data-i18n-placeholder="busStopPlaceholder"
          >

          <div
            id="destination-stop-suggestions"
            class="bus-suggestions"
          ></div>

        </div>

      </div>



      <!-- Search Routes -->

      <button
        id="route-search-button"
        data-i18n="searchRoutes"
        disabled
      >
        Search Routes
      </button>


      </div>


      <div
        id="route-results"
        aria-live="polite"
      ></div>


      <div
        id="bus-location-controls"
        hidden
      >

        <button
          id="bus-location-button"
          type="button"
          data-i18n="busLocation"
        >
          Show Current Bus Location
        </button>

        <div
          id="bus-location-status"
          role="status"
          aria-live="polite"
        ></div>

      </div>


    </div>

  </div>



  <!-- ========================================
       Map
  ======================================== -->

  <div id="map"></div>



  <script
    src="./assets/vendor/leaflet/leaflet.js"
  ></script>



  <script src="./app.js?v=20260919-ios-keyboard"></script>


</body>

</html>
